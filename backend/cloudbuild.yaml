# Cloud Build config that builds the backend image and deploys it to Cloud Run.
# Trigger manually via:
#   gcloud builds submit --config=cloudbuild.yaml .
# Or wire a trigger to the GitHub repo (push to main → build + deploy).
#
# Substitutions (override via --substitutions=KEY=VAL):
#   _SERVICE   Cloud Run service name              (default: command-center-backend)
#   _REGION    Region to deploy to                 (default: us-central1)
#   _REPO      Artifact Registry docker repo name  (default: command-center)

substitutions:
  _SERVICE: command-center-backend
  _REGION: us-central1
  _REPO: command-center

steps:
  # Build the container image.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${COMMIT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"
      - .

  # Push both tags.
  - name: gcr.io/cloud-builders/docker
    args: [push, "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}"]

  # Deploy to Cloud Run.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=3
      - --timeout=3600  # 60 min — captures take time
      # Secrets wire-up — each one must exist in Secret Manager with the Cloud
      # Run service account granted secretAccessor on it. Create them with:
      #   gcloud secrets create APIFY_TOKEN --replication-policy=automatic
      #   printf '%s' "$APIFY_TOKEN" | gcloud secrets versions add APIFY_TOKEN --data-file=-
      - --update-secrets=APIFY_TOKEN=APIFY_TOKEN:latest
      - --update-secrets=INS_KEEPA_KEY=INS_KEEPA_KEY:latest
      - --update-secrets=BRIGHTDATA_SERP_KEY=BRIGHTDATA_SERP_KEY:latest
      - --update-secrets=ADMIN_SHARED_SECRET=ADMIN_SHARED_SECRET:latest

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${COMMIT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s  # 20 min build cap
