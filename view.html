  .viewer-missing code { background: #ececec; padding: 1px 6px; border-radius: 4px; font-family: 'Spline Sans Mono', ui-monospace, monospace; font-size: 12px; }
  body[data-missing] #rail, body[data-missing] #main, body[data-missing] #scrim, body[data-missing] #drawer { display: none !important; }
</style>

<body>
<script>
// The shell reads window.__CCO_PAYLOAD if set and otherwise falls back to a
// fetch of body.dataset.payload. The pre-populated path waits for DOMContentLoaded
// before invoking the page renderers — which is exactly what we need, because the
// renderers in cco-dashboard-pages.js register themselves inline during HTML parse,
// and we want the first paint to happen only once all four shell scripts below
// have executed in order. A Blob-URL fetch would resolve on the next microtask,
// before the page renderers are registered, and the scorecard body would come up
// empty. Pre-populating + static script tags is the ordering the shell was built
// for.
(function () {
  "use strict";
  var STORE = "cct_brands_v1";
  var slug = new URLSearchParams(location.search).get("slug");
  if (!slug) { document.body.setAttribute("data-missing", "no-slug"); return; }
  var store;
  try { store = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { store = {}; }
  var brand = store[slug];
  if (!brand || !brand.payload) { document.body.setAttribute("data-missing", slug); return; }
  window.__CCO_PAYLOAD = brand.payload;
  document.title = (brand.payload.meta && brand.payload.meta.title) || (brand.name + " · Commercial Command Center");
})();
</script>

<div id="missing" class="viewer-missing" style="display:none">
  <h1>No brand found</h1>
  <p id="missingMsg">The URL expects <code>?slug=&lt;brand&gt;</code>, and that slug has to exist in your browser's localStorage. Go create one.</p>
  <a href="./admin.html">Add a brand →</a>
</div>
<script>
// If the pre-pop step above marked the body as missing, flip the fallback UI on.
// The dashboard scaffolding below is hidden by the body[data-missing] CSS rule,
// so even though the shell scripts still load and fetch the default sample payload,
// nothing is visible to the user.
(function () {
  if (!document.body.hasAttribute("data-missing")) return;
  document.getElementById("missing").style.display = "";
  var slug = document.body.getAttribute("data-missing");
  if (slug && slug !== "no-slug") {
    document.getElementById("missingMsg").textContent =
      'No brand "' + slug + '" found in your browser\'s localStorage. Create it on the admin page.';
  }
})();
</script>
